<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校務問答・管理後台</title><link rel="stylesheet" href="/static/admin.css?v=20260901d"></head><body><main>
<header><div><small>校務問答</small><h1>管理後台</h1><p>營運數據總覽・所有時間為台灣時間（UTC+8）</p></div><div class="header-actions"><select id="days"><option value="7">最近 7 天</option><option value="30">最近 30 天</option><option value="90">最近 90 天</option><option value="365">最近 1 年</option></select><a href="/faq-admin">常見問題管理</a><a href="/">返回問答</a><button id="export">匯出 CSV</button><button id="admin-logout" hidden>登出</button></div></header>
<section id="login" class="login"><h2>管理者登入</h2><p>輸入管理密碼以開啟需求單後台。</p><form id="login-form"><input id="token" type="password" placeholder="管理密碼" required><button>登入</button></form><p id="login-error"></p></section>
<div id="dashboard" hidden>
<section id="stats" class="stats"></section>
<section class="dashboard-card"><div class="section-title"><h2>各單位總覽</h2><small>依問題數排序，評分數少於 5 則不顯示平均</small></div><div id="office-overview" class="unit-table"></div></section>
<div class="dashboard-split"><section class="dashboard-card"><div class="section-title"><h2>全校評分分布</h2><small id="rating-count"></small></div><div id="rating-distribution"></div><p class="note" id="rating-note"></p></section><section class="dashboard-card"><div class="section-title"><h2>待處理提問單</h2><small>依等待時間排序</small></div><div id="pending-overview" class="pend-table"></div></section></div>
<p class="dash-foot" id="dash-foot"></p>
<section class="toolbar"><div><button class="filter active" data-status="">全部</button><button class="filter" data-status="待處理">待處理</button><button class="filter" data-status="處理中">處理中</button><button class="filter" data-status="已解決">已解決</button></div><select id="office-filter"><option value="">所有處室</option></select></section>
<section class="mail-section"><div class="section-title"><h2>需求單通知信箱</h2><span id="mail-state"></span></div><p>學生送出需求單後，系統依 AI 判斷的處室，自動寄送問題、需求單連結與該處室登入碼。</p><form id="mail-form"><div class="mail-grid"><label>寄件服務<input id="mail-server" disabled></label><label>連接埠<input id="mail-port" type="number" disabled></label><label>寄件帳號<input id="mail-username" type="email" disabled></label><label>寄件人顯示名稱<input id="mail-from-name"></label><label>信件主旨標題<input id="mail-subject-tag" placeholder="校務AI系統"></label><label class="wide" hidden>應用程式密碼<input id="mail-password" type="password"></label></div><h3>各處室指定信箱</h3><div class="office-mail-grid" id="office-mails"></div><div class="student-mail-head"><div><h3>學生回覆完成通知信箱</h3><p>處室結案後，系統會把 Q、A 與評分連結寄到下列信箱。</p></div><button type="button" id="student-mail-add">＋ 增加信箱</button></div><div id="student-mails" class="student-mail-list"></div><div class="mail-actions"><button class="save" type="submit">儲存設定</button><label class="test-mail-label">測試收件信箱<input id="mail-test-to" type="email" autocomplete="email" placeholder="請輸入測試收件信箱"></label><button type="button" id="mail-test">寄送測試信</button><button type="button" id="mail-reset">全部填回預設信箱</button></div><p id="mail-message"></p></form></section>
<section class="ticket-section"><div class="section-title"><h2>完整需求單列表</h2><span id="count"></span></div><div class="table-wrap"><table><thead><tr><th>需求單編號</th><th>分類／主旨</th><th>主管單位</th><th>建立時間</th><th>評分</th><th>狀態</th><th></th></tr></thead><tbody id="tickets"></tbody></table></div></section>
</div></main>
<dialog id="detail"><form id="update-form"><div class="detail-head"><div><small id="detail-no"></small><h2 id="detail-subject"></h2></div><button type="button" id="detail-close">×</button></div><div id="detail-body"></div><label>處理狀態<select id="update-status"><option>待處理</option><option>處理中</option><option>已解決</option></select></label><label>承辦人<input id="update-assignee"></label><label>處理結果<textarea id="update-resolution" rows="5"></textarea></label><button class="save">儲存更新</button></form></dialog>
<script src="/static/admin.js?v=20260907-subject-tag"></script></body></html>
