<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>處室需求單清單</title><link rel="stylesheet" href="/static/office.css?v=20260901"></head><body><main><header><div><small>校務問答</small><h1>處室回覆清單</h1><p id="office-name">登入後顯示分派給本處室的需求單</p></div><a href="/">返回問答</a></header><section id="login" class="login"><h2>處室承辦人登入</h2><p>請輸入本處室專屬登入碼。</p><form id="login-form"><input id="token" type="password" placeholder="處室登入碼" required><button>登入</button></form><p id="error"></p></section><section id="queue" hidden><nav><button class="filter active" data-status="">全部</button><button class="filter" data-status="待處理">待處理</button><button class="filter" data-status="處理中">處理中</button><button class="filter" data-status="已解決">已解決</button><button id="logout">登出</button></nav><section class="mail-card"><div><small>本處室設定</small><h2>需求單通知信箱</h2><p>AI 分派到本處室的新需求單，會寄到這個信箱。此處只能修改本處室的地址。</p></div><form id="office-mail-form"><label>收件電子郵件<input id="office-email" type="email" required autocomplete="email" placeholder="office@example.edu.tw"></label><button type="submit">儲存信箱</button><p id="office-mail-message"></p></form></section><div class="summary" id="summary"></div><div class="list" id="tickets"></div></section></main><script src="/static/office.js?v=20260901-remember"></script></body></html>
