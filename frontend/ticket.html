<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校務問答・提問單回覆</title><link rel="stylesheet" href="/static/ticket-page.css?v=20260901"></head><body><main class="sheet"><header><div><small>校務問答</small><h1>提問單回覆</h1><div><span id="ticket-no"></span><span id="status-badge" class="badge"></span></div></div><div class="owner"><small>主管單位</small><strong id="office"></strong></div></header><div id="loading">正在讀取需求單…</div><div id="content" class="layout" hidden><section class="main-col"><article class="question-card"><div class="card-title"><span>提問內容</span><small id="meta"></small></div><h2 id="subject"></h2><p id="description"></p><div class="ai-note"><span>AI 查無資料</span> 系統已將問題轉交承辦單位處理。</div></article><article class="rate-card" id="rate-card" hidden><h2>這次的處理滿意嗎？</h2><p id="rate-hint">承辦單位已結案，請給 1～5 星評價。1～2 星會自動重啟提問單，再請單位確認一次。</p><div class="stars" id="stars"></div><textarea id="rate-comment" rows="3" placeholder="想補充說明嗎？（可不填）"></textarea><div class="rate-bottom"><small>評分會計入該單位的服務品質統計</small><button type="button" id="rate-submit" disabled>送出評分</button></div><p id="rate-status"></p></article><article class="reply-card"><h2>補充內容</h2><form id="reply-form"><textarea id="reply" rows="11" placeholder="若承辦人需要更多資訊，或您想補充說明，請在這裡輸入…" required></textarea><label class="consent"><input id="allow-faq" type="checkbox"> 同意將本次問答整理為匿名 FAQ，供 AI 日後回答相似問題</label><div class="reply-bottom"><small>送出後承辦單位可在後台看到補充內容</small><button>送出補充</button></div><p id="reply-status"></p></form></article></section><aside><section class="transfer"><h3>這題不屬於本單位？</h3><p>若處室轉派，系統會在下方處理紀錄顯示最新承辦單位。</p><strong id="current-office"></strong></section><section class="timeline"><h3>處理紀錄</h3><div id="events"></div></section></aside></div><footer>本頁包含個人服務需求單資訊，請勿分享含有存取碼的網址。所有時間為台灣時間（UTC+8）。</footer></main><script src="/static/ticket-page.js?v=20260901"></script></body></html>
